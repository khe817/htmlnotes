<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{note.title}}</title>
    <style type="text/css">
        body, html {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        code, pre {
            font-size: 1.1em;
            background-color: #eee;
        }

        pre {
            display: inline-block;
            width: 100%;
            vertical-align: top;
            font-family: monospace;
            padding: 0.5em;
            white-space: pre;
            overflow-x: auto;
        }

        h1#note-title-{{note.id}} {
            color: #1c84c6;
            font-size: xx-large;
            font-weight: bold;
        }

        #note-tags-{{note.id}} {
            background-color: #1ab394;
            border-color: #1ab394;
            color: #FFF;
            padding: 0.2rem;
            border-radius: 6px;
        }

        #{{note.id}} {
            position: relative;
            display: block;
            padding: 5pt;
            margin: 5pt;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <h1 id="note-title-{{note.id}}">{{note.title}}</h1>
    <p><strong>Tags:</strong> <span id="note-tags-{{note.id}}">{{note.tags}}</span></p>
    <hr>
    <div id="{{note.id}}" data-is-pinned="0">
        {{note.content}}
    </div>
</body>
