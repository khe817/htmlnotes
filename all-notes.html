<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localhost - HTMLNotes</title>
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/htmlnotes/assets/block-ui/block-ui.css">
    <link rel="stylesheet" href="/htmlnotes/assets/app.css">
</head>
<body>
    <div class="app-container">
        <!-- left sidebar -->
        <div id="left-sidebar" class="sidebar">
            <button class="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
            <div class="sidebar-title">
                <h1>HTMLNotes</h1>
            </div>
            <div class="new-note-container">
                <a href="/htmlnotes/#new-note" class="btn add-note-btn" aria-label="Create a new note">New Note</a>
            </div>
            <div class="search-container">
                <input type="text" class="search-box" placeholder="Search notes..." id="searchInput" aria-label="Search notes">
            </div>
            <div class="controls" id="filterControls">
                <button class="btn active" data-filter="all" aria-label="Show all notes">All Notes</button>
                <button class="btn" data-filter="recent" aria-label="Show recent notes">Recent</button>
            </div>

            <h4 class="sidebar-tags-title">All tags</h4>
            <div class="notes-list" id="tagsList"></div>
        </div>

        <!-- main content -->
        <div class="main-content" id="mainContent">
            <h1>All Notes</h1>

            <div class="notes-list" id="notesList"></div>

            <!-- Flash message -->
            <div id="flash-container"></div>
        </div>
    </div>

    <!-- preloader overlay while page loads -->
    <div id="preloader" class="no-display"></div>

    <script src="/htmlnotes/assets/all-notes.js" type="module"></script>
</body>
</html>
